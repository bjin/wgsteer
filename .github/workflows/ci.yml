name: CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (linux/amd64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Tags and history: go build stamps the version from the latest tag.
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - run: make test
      - run: make build
      - run: ./wgsteer --version

  integration:
    name: Integration (linux/amd64)
    # Not on tags: the tagged commit already ran it on master, and it does not gate releases.
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: Prepare host
        run: |
          sudo apt-get update -q
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -yq --no-install-recommends iperf3 nftables wireguard-tools
          # Ubuntu's AppArmor withholds capabilities inside unprivileged user namespaces.
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          # Load the kernel modules up front: a missing one fails here instead of mid-suite.
          sudo modprobe -a wireguard veth tun nf_tables sch_netem sch_ingress cls_flower act_pedit act_csum
      - run: make integration

  build:
    name: Build (linux/${{ matrix.goarch }})
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 64-bit only: the pinned github.com/google/nftables does not compile
        # for 32-bit targets (docs/caveats.md#no-32-bit-builds).
        goarch: [amd64, arm64, mips64]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: Build and package
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          # No hardware FPU on most OpenWrt octeon routers; ignored for other GOARCH.
          GOMIPS64: softfloat
        run: |
          name=wgsteer-${GITHUB_REF_NAME#v}-linux-$GOARCH
          stage=$RUNNER_TEMP/$name
          mkdir -p "$stage"
          make build BINARY="$stage/wgsteer"
          stamped=$(go version -m "$stage/wgsteer" | awk '$1 == "mod" { print $3 }')
          if [ "$stamped" != "$GITHUB_REF_NAME" ]; then
            echo "::error::binary version is $stamped, want $GITHUB_REF_NAME (the tag must be a semver version)"
            exit 1
          fi
          cp LICENSE README.md "$stage/"
          tar -C "$RUNNER_TEMP" --owner=0 --group=0 --numeric-owner -czf "$RUNNER_TEMP/$name.tar.gz" "$name"
          echo "ASSET=$RUNNER_TEMP/$name.tar.gz" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v7
        with:
          name: linux-${{ matrix.goarch }}
          path: ${{ env.ASSET }}
          if-no-files-found: error
          compression-level: 0

  release:
    name: Publish pre-release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Create pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz
          --repo "$GITHUB_REPOSITORY" --verify-tag --prerelease
          --title "$GITHUB_REF_NAME" --generate-notes
